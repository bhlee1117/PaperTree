- id: C5.1
  parent: Q5
  text: EC3 input is a target signal, not an error signal.
  status: contested
  note: 'Magee''s argument is negative evidence with a clear logic — EC3 activity stayed constant
    while CA1 adapted, which is not what an error signal does. The predictive-coding models require
    error. Chavlis & Poirazi state outright the question is unresolved.

    '
  evidence:
  - key: magee_2026
    doi: 10.1038/s41593-026-02214-2
    stance: supports
    strength: direct
