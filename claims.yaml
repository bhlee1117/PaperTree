- id: C2.3a
  parent: Q2
  text: NMDA spikes are spatially restricted to the branch that generates them.
  status: settled
  note: 'Settled by mechanism rather than by accumulated observation: NMDAR gating needs both
    glutamate and depolarisation, so the event cannot exist outside the glutamate field. Kept
    in the tree as the calibration point for what ''settled'' means here.'
  evidence:
  - key: schiller_2000
    doi: 10.1038/35005094
    stance: supports
    strength: direct
    region: L5
    modality: patch
    condition: NMDA spikes confined to the activated basal branch
  - key: stuart_spruston_2015
    doi: 10.1038/nn.4157
    stance: supports
    strength: indirect
    region: both
    modality: review
    condition: NMDA spikes cannot propagate beyond the region of glutamate release, since NMDAR
      activation requires both glutamate and depolarisation
- id: C2.3b
  parent: Q2
  text: Dendritic Na spikes are spatially restricted to the branch that generates them.
  status: contested
  note: 'SPLITTING THIS OUT CHANGED THE ANSWER. In the merged node Park''s result was diluted
    by the NMDA and plateau evidence. Isolated, it is a head-on contradiction: Park''s dSpikes
    are Na-mediated (abolished by 20 nM TTX) yet engaged the whole apical tree with no branch
    preference. Either impedance confinement fails for bAP-driven Na spikes, or locally-initiated
    and bAP-driven Na spikes are different objects sharing a name.'
  evidence:
  - key: golding_spruston_1998
    stance: supports
    strength: direct
    region: CA1
    modality: patch
    condition: Na spikes are variable triggers of axonal APs; often fail to reach the soma
  - key: stuart_spruston_2015
    doi: 10.1038/nn.4157
    stance: supports
    strength: indirect
    region: both
    modality: review
    condition: Na spikes fail propagating from small high-impedance dendrites into larger low-impedance
      ones
  - key: ariav_2003
    stance: supports
    strength: direct
    region: CA1
    modality: patch
    condition: fast Na dendritic spikes in basal dendrites with submillisecond precision
  - key: park_2025
    doi: 10.1038/s41467-025-55819-9
