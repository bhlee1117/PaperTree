- id: C7.1
  parent: Q7
  text: Dendritic calcium signals report dendritic voltage.
  status: contested
  note: 'THIS NODE RE-WEIGHTS MOST OTHERS. Beaulieu-Laroche calibrated it directly and found subthreshold
    depolarisation produces negligible GCaMP6f signal — so calcium reports suprathreshold electrogenesis,
    not membrane potential. Park adds a spatial argument: Ca diffuses ~2 um in 100 ms while electrical
    length constants exceed 100 um, so the two signals have different spatial structure by construction.
    Most in vivo dendritic literature is calcium. Every claim above resting on calcium in vivo
    inherits this scope.

    '
  evidence:
  - key: beaulieu_laroche_2019
    doi: 10.1016/j.neuron.2019.05.014
    stance: qualifies
    strength: direct
    region: L5
    condition: ex vivo dual patch + GCaMP6f — subthreshold produces negligible dF/F, suprathreshold
      electrogenesis produces significant dF/F. Calcium reports electrogenesis specifically
    modality: patch
  - key: park_2025
    doi: 10.1038/s41467-025-55819-9
    stance: contradicts
    strength: indirect
    region: CA1
    condition: Ca buffered diffusion <20 um2/s gives ~2 um spread per 100 ms vs >100 um electrical
      length constants; calls for simultaneous voltage and calcium imaging to settle it
    modality: voltage
    flags: *id001
  - key: fischer_2022
    doi: 10.1523/JNEUROSCI.1132-22.2022
    stance: qualifies
    strength: indirect
    region: both
    condition: names calcium temporal resolution and fluorescence nonlinearity as formidable obstacles
    modality: review
  - key: stuart_spruston_2015
    doi: 10.1038/nn.4157
    stance: assumes
    strength: assumed
    region: both
    condition: treats in vivo calcium imaging as evidence for dendritic spikes throughout
    modality: review
