    flags:
    - optogenetic
    condition: TTX-sensitive dSpikes engaged the entire apical tree regardless of stimulus location;
      no branch preference in 17 neurons
- id: C2.3c
  parent: Q2
  text: Dendritic Ca plateau potentials are spatially restricted to the compartment that generates
    them.
  status: contested
  note: 'Probably false as written, and the interesting part is the unit. Ca spikes are restricted
    to a DOMAIN (the distal apical initiation zone) but propagate freely within and beyond it.
    If the tree keeps confusing domain-level with branch-level confinement, the fix is a `unit:
    branch|domain|cell` field rather than more nodes.'
  evidence:
  - key: schiller_1997
    stance: supports
    strength: direct
    region: L5
    modality: patch
    condition: Ca action potentials restricted to distal apical dendrites — a domain claim, not
      a branch claim
  - key: magee_2026
