questions:
- id: Q1
  text: '"What initiates dendritic regenerative events?"'
- id: Q2
  text: '"How far do dendritic events spread'
  and is the branch an independent unit?": ''
- id: Q3
  text: '"What are dendritic excitations for — integration'
  or plasticity?": ''
- id: Q4
  text: '"What plasticity rule builds hippocampal place fields?"'
- id: Q5
  text: '"What does the instructive signal represent?"'
- id: Q6
  text: '"How is a memory maintained across days?"'
- id: Q7
  text: '"What can each recording modality actually resolve?"'
claims:
- id: C1.1
  parent: Q1
  text: Dendrites initiate regenerative spikes locally, without a preceding somatic action potential.
  status: contested
  note: 'The split tracks stimulus modality, not preparation. Every positive report used strong,
    spatially concentrated, fast-onset drive; the one negative report used gradual distributed
    optogenetic drive. Stuart & Spruston quantify the requirement at a handful to dozens of inputs
    within a few ms in a localised region — which is precisely what optogenetics does not deliver.
    The unresolved question is which regime real synaptic bombardment resembles.

    '
  evidence:
  - key: golding_spruston_1998
    stance: supports
    strength: direct
    region: CA1
    condition: strong local current injection into the dendrite
    modality: patch
  - key: losonczy_magee_2006
    doi: 10.1016/j.neuron.2006.03.016
    stance: supports
    strength: direct
    region: CA1
    condition: synchronous clustered glutamate uncaging on radial oblique branches
    modality: patch
  - key: schiller_2000
    doi: 10.1038/35005094
    stance: supports
    strength: direct
    region: L5
    condition: clustered input to basal dendrites; NMDA-dependent
    modality: patch
  - key: stuart_spruston_2015
    doi: 10.1038/nn.4157
    stance: qualifies
    strength: indirect
    region: both
    condition: review; quantifies the requirement as a handful to dozens of inputs in a localised
      region within a few ms, and asks openly whether that ever happens in vivo
    modality: review
  - key: park_2025
    doi: 10.1038/s41467-025-55819-9
    stance: contradicts
    strength: direct
    region: CA1
    condition: optogenetic drive (~130 pA, distributed), acute slice at 34 C. Never observed dendrite-initiated
      dSpikes; attributes this to stimulus modality and reproduces it in a conductance-based model
    modality: voltage
    flags: &id001
    - optogenetic
  - key: chavlis_poirazi_2026
    doi: 10.1146/annurev-neuro-090325-115846
    stance: assumes
    strength: assumed
    region: both
    condition: treats local NMDA spikes as the established substrate of branch computation
    modality: review
- id: C1.2
  parent: Q1
  text: 'Whether a bAP becomes a dendritic spike is set by prior dendritic depolarisation, not
    by somatic spike rate.

    '
  status: contested
  note: 'REGION CONFOUND, FLAGGED. Every "rate is the variable" result is L5/cortex; the only
    "depolarisation is the variable" result is CA1. Per the no-region-split decision these sit
    on one node, but the confound is total and should be resolved before either framing is treated
    as general. The cleanest test would be the Park ramp protocol run in L5.

    '
  evidence:
  - key: larkum_1999_pnas
    stance: contradicts
    strength: direct
    region: L5
    condition: critical bAP frequency (~100 Hz) for distal Ca electrogenesis
    modality: patch
  - key: beaulieu_laroche_2019
    doi: 10.1016/j.neuron.2019.05.014
    stance: contradicts
    strength: direct
    region: L5
    condition: ex vivo dual patch, V1 L5 — 200 Hz bAP trains engage dendritic electrogenesis,
      50 Hz do not. Frequency dependence is explicit.
    modality: calcium
  - key: larkum_zhu_sakmann_1999
    doi: 10.1038/18686
    stance: qualifies
    strength: direct
    region: L5
    condition: BAC firing — a single bAP paired with distal input suffices, which is nearer Park's
      rule than the frequency framing is
    modality: patch
  - key: park_2025
    doi: 10.1038/s41467-025-55819-9
    stance: supports
    strength: direct
    region: CA1
    condition: an isolated bAP becomes a dSpike if the distal dendrite was depolarised >=15 ms
      beforehand; sigmoidal dependence on stimulus distance, ~80% beyond 300 um
    modality: voltage
    flags: *id001
- id: C1.3
  parent: Q1
  text: 'A-type Kv inactivation opens the dendritic spike window and slow Nav inactivation closes
    it, making the dendrite a spike-rate accelerometer.

    '
  status: open
  note: 'The two channel contributions are each well established separately; the claim that their
    timescales jointly define a transient window is new and rests on one paper plus its model.
    Prime candidate for replication, and the strongest single thing to look for in vivo.

    '
  evidence:
  - key: park_2025
    doi: 10.1038/s41467-025-55819-9
    stance: supports
    strength: direct
    region: CA1
    condition: 4-AP and Ba2+ raise dSpike probability, 20 nM TTX lowers it; NEURON model reproduces
      the failure-success-failure motif across a wide parameter range
    modality: voltage
    flags: *id001
  - key: hoffman_1997
    stance: supports
    strength: indirect
    region: CA1
    condition: measured the ~6-fold distal enrichment and inactivation kinetics of A-type Kv
    modality: patch
  - key: stuart_spruston_2015
    doi: 10.1038/nn.4157
    stance: supports
    strength: indirect
    region: both
    condition: reviews Kv channels as restricting dendritic Ca spike generation and spread, and
      bAP-driven reduction of subsequent Na spike probability — the ingredients, not the synthesis
    modality: review
  - key: magee_2026
    doi: 10.1038/s41593-026-02214-2
    stance: assumes
    strength: assumed
    region: CA1
    condition: Box 1 treats Kv and HCN as plateau regulators without this framing
    modality: review
- id: C1.4
  parent: Q1
  text: 'Plateau potentials require collision of a dendritic Na spike with glutamatergic input;
    coincidence of distal input with somatic spiking alone is not sufficient.

    '
  status: open
  note: 'Sharpest testable prediction in the set, and a real constraint on BTSP: during sustained
    fast firing the dendrite is refractory, so a distal input arriving late in a spike train cannot
    induce plasticity. If it holds, BTSP has a duty cycle. Untested in vivo.

    '
  evidence:
  - key: park_2025
    doi: 10.1038/s41467-025-55819-9
    stance: supports
    strength: direct
    region: CA1
    condition: EFS at 0.5 s into an optogenetic ramp evoked plateaus, at 2.5 s (24 Hz sustained)
      did not. D-AP5, Ni2+ and TTX each reduce the plateau, so NMDAR, VGCC and Nav are all necessary
    modality: voltage
    flags: *id001
  - key: takahashi_magee_2009
    stance: qualifies
    strength: direct
    region: CA1
    condition: high-frequency EFS trains; stronger NMDAR dependence than Park saw with a single
      pulse. Induction protocol, not biology, may explain the gap
    modality: patch
  - key: magee_2026
    doi: 10.1038/s41593-026-02214-2
    stance: assumes
    strength: assumed
    region: CA1
    condition: treats plateaus as reliably inducible by EC3/CA3 conjunction; no refractory window
    modality: review
  - key: fischer_2022
    doi: 10.1523/JNEUROSCI.1132-22.2022
    stance: assumes
    strength: assumed
    region: CA1
    condition: '"only a single plateau potential is sufficient" — stated without a rate caveat'
    modality: review
- id: C1.5
  parent: Q1
  text: 'The dendritic spike is a cell-wide broadcast carrying timing but not spatial information;
    synapse identity is carried by glutamate-bound NMDARs.

    '
  status: open
  note: 'Answers "where is the eligibility trace" by elimination: dSpike footprints did not depend
    on which branch was stimulated, so voltage cannot carry it. Stuart & Spruston reach a compatible
    worry from the opposite direction — if dSpikes occur spontaneously from background activity,
    they cannot be input-specific either. Two independent routes to the same conclusion is the
    strongest thing this node has.

    '
  evidence:
  - key: park_2025
    doi: 10.1038/s41467-025-55819-9
    stance: supports
    strength: direct
    region: CA1
    condition: bAP and dSpike spatial profiles insensitive to stimulus location; no preference
      for the stimulated branch
    modality: voltage
    flags: *id001
  - key: stuart_spruston_2015
    doi: 10.1038/nn.4157
    stance: supports
    strength: indirect
    region: both
    condition: notes that spontaneous dSpikes from background synaptic activity, without clustered
      input, "questions their role in information processing"
    modality: review
  - key: chavlis_poirazi_2026
    doi: 10.1146/annurev-neuro-090325-115846
    stance: contradicts
    strength: indirect
    region: both
    condition: 'reviews branch-specific plasticity and clustered spine formation as evidence that
      the branch is the unit of memory allocation. May be scope rather than conflict: clustered-input
      regime vs bAP-driven regime'
    modality: review
- id: C2.1
  parent: Q2
  text: Dendritic branches act as independent computational subunits.
  status: contested
  note: 'Independence is conditional on impedance, not a property of branches. Wybo 2019 formalises
    this; Otor 2022 shows a subcompartment''s morphology predicts its functional independence.
    So the honest form of this claim is "under conditions X" — and nobody has measured how often
    X holds in vivo.

    '
  evidence:
  - key: poirazi_2003
    stance: supports
    strength: direct
    region: CA1
    condition: model; branches as independent sigmoidal subunits
    modality: model
  - key: losonczy_magee_2006
    doi: 10.1016/j.neuron.2006.03.016
    stance: supports
    strength: direct
    region: CA1
    condition: branch-local spike initiation with sharp threshold in oblique dendrites
    modality: patch
  - key: cichon_gan_2015
    stance: supports
    strength: direct
    region: L5
    condition: distinct motor skills engage non-overlapping apical tuft branches in vivo
    modality: calcium
  - key: voigts_harnett_2020
    stance: supports
    strength: direct
    region: RSC
    condition: apical segments carry spatial tuning different from their own soma
    modality: calcium
  - key: wybo_2019
    stance: qualifies
    strength: direct
    region: model
    condition: independence requires sufficiently high inter-branch impedance; dynamically regulated
    modality: model
  - key: stuart_spruston_2015
    doi: 10.1038/nn.4157
    stance: qualifies
    strength: indirect
    region: both
    condition: Na spikes fail propagating from high- to low-impedance dendrites; NMDA spikes cannot
      leave the glutamate-release region. Compartmentalisation is a propagation failure, not a
      designed boundary
    modality: review
  - key: park_2025
    doi: 10.1038/s41467-025-55819-9
    stance: contradicts
    strength: direct
    region: CA1
    condition: under bAP-driven conditions dSpikes engaged the whole apical tree, with no branch
      preference
    modality: voltage
    flags: *id001
- id: C2.2
  parent: Q2
  text: Somatic and dendritic activity are highly correlated in vivo.
  status: contested
  note: 'Fischer 2022 states this split explicitly with both citation lists, which is why this
    node exists in this form. CRITICAL SCOPE, see C7.1 — every "highly correlated" result is calcium,
    and Beaulieu-Laroche''s own calibration shows GCaMP6f is blind to subthreshold. So the correlation
    claim is about suprathreshold events only, and the two camps may not be measuring the same
    thing.

    '
